{{ $imgid := .Get "imgid" }}
{{ $name := .Get "name" }}
{{ $link := .Get "link" }}
{{ $slides := $.Page.Resources.Match $imgid }}

<div class="col">
<div class="proj_entry col">
  {{ partial "carousel.html" (dict
      "slides" $slides
      "id" $imgid
  ) }}
  {{ if $link }}
    <a class="proj_name" href="{{ $link }}">{{ $name }}</a>
  {{ else }}
    <div class="proj_name">{{ $name }}</div>
  {{ end }}
  <div class="proj_desc">{{ .Inner }}</div>
</div>
</div>
